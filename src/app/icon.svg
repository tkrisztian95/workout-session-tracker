<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WST — Workout Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="url(#brand)" transform="translate(0,-32)">
    <rect x="96"  y="148" width="32" height="80"  rx="10"/>
    <rect x="134" y="124" width="40" height="128" rx="12"/>
    <rect x="174" y="172" width="164" height="32" rx="8"/>
    <rect x="338" y="124" width="40" height="128" rx="12"/>
    <rect x="384" y="148" width="32" height="80"  rx="10"/>
  </g>

  <text
    x="256" y="430"
    text-anchor="middle"
    font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif"
    font-weight="900"
    font-size="180"
    letter-spacing="-6"
    fill="url(#brand)"
  >WST</text>
</svg>
